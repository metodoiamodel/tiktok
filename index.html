<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10182D">
  <meta name="description" content="Site oficial.">
  <title>Carregando…</title>

  <!-- Redirecionamento imediato via meta refresh (funciona mesmo se o JS demorar a rodar) -->
  <meta http-equiv="refresh" content="0; url=https://metodoiamodel.com.br/">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #080B14;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .loading-text {
      color: #667080;
      font-size: 18px;
    }
  </style>

  <script>
    // Redireciona imediatamente assim que o script roda (mais rápido que esperar o meta refresh em alguns navegadores)
    window.location.replace("https://metodoiamodel.com.br/");
  </script>
</head>

<body>
  <p class="loading-text">Carregando…</p>

  <!-- Fallback caso JS e meta refresh estejam desabilitados -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://metodoiamodel.com.br/">
    <p>
      <a href="https://metodoiamodel.com.br/">Clique aqui para continuar</a>
    </p>
  </noscript>
</body>
</html>
